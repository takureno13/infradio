<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="sans-serif">
  <rect x="0" y="0" width="1200" height="675" rx="12" fill="#171a26"/>
  <text x="600" y="62" text-anchor="middle" font-size="40" font-weight="bold" fill="#e8eaf2">仮想基盤 #1：1台を<tspan fill="#ffd028">区切って</tspan>、複数として使う</text>
  <g fill="none" stroke="#e8eaf2" stroke-width="3">
    <rect x="60" y="100" width="380" height="160" rx="8"/>
    <rect x="660" y="100" width="480" height="160" rx="8"/>
  </g>
  <text x="250" y="142" text-anchor="middle" font-size="28" fill="#e8eaf2">1チームが専用</text>
  <g fill="#e8eaf2">
    <circle cx="100" cy="222" r="13"/>
    <circle cx="134" cy="222" r="13"/>
    <circle cx="117" cy="194" r="13"/>
  </g>
  <rect x="190" y="178" width="230" height="66" rx="6" fill="none" stroke="#e8eaf2" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="305" y="222" text-anchor="middle" font-size="28" fill="#e8eaf2" fill-opacity="0.6">ほとんど空き</text>
  <line x1="455" y1="180" x2="625" y2="180" stroke="#ffd028" stroke-width="5"/>
  <polygon points="645,180 620,166 620,194" fill="#ffd028"/>
  <text x="550" y="160" text-anchor="middle" font-size="28" fill="#ffd028">間仕切り</text>
  <g stroke="#ffd028" stroke-width="6">
    <line x1="820" y1="100" x2="820" y2="260"/>
    <line x1="980" y1="100" x2="980" y2="260"/>
  </g>
  <g font-size="30" font-weight="bold" fill="#e8eaf2" text-anchor="middle">
    <text x="740" y="148">A</text>
    <text x="900" y="148">B</text>
    <text x="1060" y="148">C</text>
  </g>
  <g fill="#e8eaf2">
    <circle cx="722" cy="215" r="13"/><circle cx="758" cy="215" r="13"/>
    <circle cx="882" cy="215" r="13"/><circle cx="918" cy="215" r="13"/>
    <circle cx="1042" cy="215" r="13"/><circle cx="1078" cy="215" r="13"/>
  </g>
  <text x="900" y="298" text-anchor="middle" font-size="28" fill="#e8eaf2">複数チームが同時に、干渉せず使える</text>
  <line x1="40" y1="318" x2="1160" y2="318" stroke="#e8eaf2" stroke-opacity="0.2" stroke-width="2"/>
  <rect x="60" y="340" width="380" height="200" rx="8" fill="none" stroke="#e8eaf2" stroke-width="3"/>
  <text x="250" y="384" text-anchor="middle" font-size="30" font-weight="bold" fill="#e8eaf2">物理サーバー 1台</text>
  <rect x="90" y="410" width="320" height="50" rx="4" fill="none" stroke="#e8eaf2" stroke-width="2"/>
  <rect x="90" y="410" width="64" height="50" rx="4" fill="#ffd028"/>
  <text x="282" y="445" text-anchor="middle" font-size="28" fill="#e8eaf2" fill-opacity="0.6">残りは空き</text>
  <text x="250" y="510" text-anchor="middle" font-size="28" fill="#e8eaf2">使用率 <tspan fill="#ffd028">15〜25%</tspan></text>
  <line x1="455" y1="440" x2="625" y2="440" stroke="#ffd028" stroke-width="5"/>
  <polygon points="645,440 620,426 620,454" fill="#ffd028"/>
  <text x="550" y="418" text-anchor="middle" font-size="28" fill="#ffd028">ソフトで区切る</text>
  <rect x="660" y="340" width="480" height="200" rx="8" fill="none" stroke="#e8eaf2" stroke-width="3"/>
  <text x="900" y="378" text-anchor="middle" font-size="30" font-weight="bold" fill="#e8eaf2">物理サーバー 1台</text>
  <g fill="#2a3150" stroke="#ffd028" stroke-width="3">
    <rect x="680" y="400" width="140" height="120" rx="6"/>
    <rect x="830" y="400" width="140" height="120" rx="6"/>
    <rect x="980" y="400" width="140" height="120" rx="6"/>
  </g>
  <g font-size="34" font-weight="bold" fill="#e8eaf2" text-anchor="middle">
    <text x="750" y="472">VM</text>
    <text x="900" y="472">VM</text>
    <text x="1050" y="472">VM</text>
  </g>
  <text x="600" y="592" text-anchor="middle" font-size="28" fill="#e8eaf2"><tspan fill="#ffd028" font-weight="bold">仮想化</tspan>＝1台を区切って複数に　<tspan fill="#ffd028" font-weight="bold">仮想マシン</tspan>＝区切られた一つひとつ</text>
  <text x="600" y="642" text-anchor="middle" font-size="28" fill="#e5484d">注意：土台の1台が止まると全VMに影響</text>
</svg>
