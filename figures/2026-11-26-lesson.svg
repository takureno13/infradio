<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8eaf2"/>
    </marker>
    <marker id="ahy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffd028"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1200" height="675" rx="12" fill="#171a26"/>

  <!-- 見出し -->
  <text x="600" y="62" text-anchor="middle" font-size="42" font-weight="bold" fill="#e8eaf2">仮想マシン（VM）の正体 ＝ <tspan fill="#ffd028">ファイルの集まり</tspan></text>

  <!-- ===== 左：ホストA ===== -->
  <rect x="30" y="90" width="580" height="555" rx="14" fill="#1f2333" stroke="#5a6182" stroke-width="3"/>
  <text x="50" y="135" font-size="30" font-weight="bold" fill="#e8eaf2">ホストA</text>

  <!-- 仮想マシン -->
  <rect x="200" y="105" width="390" height="80" rx="10" fill="#2a3048" stroke="#e8eaf2" stroke-width="3"/>
  <text x="395" y="156" text-anchor="middle" font-size="32" font-weight="bold" fill="#e8eaf2">仮想マシンが起動</text>

  <!-- 資源を配る 矢印 -->
  <line x1="320" y1="272" x2="320" y2="192" stroke="#e8eaf2" stroke-width="4" marker-end="url(#ah)"/>
  <text x="340" y="242" font-size="28" fill="#e8eaf2">資源を配る</text>

  <!-- ハイパーバイザー -->
  <rect x="55" y="275" width="530" height="58" rx="8" fill="#2a3048" stroke="#8a91b0" stroke-width="2"/>
  <text x="320" y="314" text-anchor="middle" font-size="30" font-weight="bold" fill="#e8eaf2">ハイパーバイザー</text>

  <!-- 読み込む 矢印 -->
  <line x1="320" y1="418" x2="320" y2="340" stroke="#e8eaf2" stroke-width="4" marker-end="url(#ah)"/>
  <text x="340" y="388" font-size="28" fill="#e8eaf2">読み込む</text>

  <!-- 保存場所 -->
  <rect x="55" y="420" width="530" height="210" rx="10" fill="#171a26" stroke="#8a91b0" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="75" y="456" font-size="28" fill="#e8eaf2">保存場所</text>

  <!-- 設定ファイル -->
  <path d="M75,472 H275 L300,497 V615 H75 Z" fill="#2a2a20" stroke="#ffd028" stroke-width="3"/>
  <path d="M275,472 V497 H300" fill="none" stroke="#ffd028" stroke-width="3"/>
  <text x="187" y="545" text-anchor="middle" font-size="30" font-weight="bold" fill="#ffd028">設定ファイル</text>
  <text x="187" y="590" text-anchor="middle" font-size="28" fill="#e8eaf2">＝設計図</text>

  <!-- 仮想ディスク -->
  <path d="M320,472 H540 L565,497 V615 H320 Z" fill="#1f2a40" stroke="#8fb4ff" stroke-width="3"/>
  <path d="M540,472 V497 H565" fill="none" stroke="#8fb4ff" stroke-width="3"/>
  <text x="442" y="545" text-anchor="middle" font-size="30" font-weight="bold" fill="#8fb4ff">仮想ディスク</text>
  <text x="442" y="590" text-anchor="middle" font-size="28" fill="#e8eaf2">＝中身</text>

  <!-- ===== 右上：たとえ ===== -->
  <rect x="640" y="90" width="530" height="165" rx="12" fill="#1f2333" stroke="#5a6182" stroke-width="2"/>
  <text x="660" y="128" font-size="28" font-weight="bold" fill="#e8eaf2">たとえ：組み立て式の家具</text>
  <!-- 説明書 -->
  <rect x="670" y="142" width="55" height="70" rx="3" fill="#2a2a20" stroke="#ffd028" stroke-width="3"/>
  <line x1="680" y1="160" x2="715" y2="160" stroke="#ffd028" stroke-width="2"/>
  <line x1="680" y1="174" x2="715" y2="174" stroke="#ffd028" stroke-width="2"/>
  <line x1="680" y1="188" x2="705" y2="188" stroke="#ffd028" stroke-width="2"/>
  <text x="697" y="244" text-anchor="middle" font-size="28" fill="#e8eaf2">説明書</text>
  <text x="748" y="190" text-anchor="middle" font-size="32" fill="#e8eaf2">＋</text>
  <!-- 部品の箱 -->
  <rect x="775" y="155" width="85" height="57" fill="#1f2a40" stroke="#8fb4ff" stroke-width="3"/>
  <line x1="775" y1="172" x2="860" y2="172" stroke="#8fb4ff" stroke-width="2"/>
  <line x1="817" y1="155" x2="817" y2="172" stroke="#8fb4ff" stroke-width="2"/>
  <text x="817" y="244" text-anchor="middle" font-size="28" fill="#e8eaf2">部品の箱</text>
  <!-- 矢印 -->
  <line x1="880" y1="182" x2="955" y2="182" stroke="#e8eaf2" stroke-width="4" marker-end="url(#ah)"/>
  <!-- 棚（家具） -->
  <rect x="1000" y="138" width="100" height="76" fill="none" stroke="#e8eaf2" stroke-width="3"/>
  <line x1="1000" y1="163" x2="1100" y2="163" stroke="#e8eaf2" stroke-width="3"/>
  <line x1="1000" y1="188" x2="1100" y2="188" stroke="#e8eaf2" stroke-width="3"/>
  <text x="1050" y="244" text-anchor="middle" font-size="28" fill="#e8eaf2">どこでも同じ</text>

  <!-- ===== 右中：コピー ===== -->
  <line x1="612" y1="330" x2="722" y2="330" stroke="#ffd028" stroke-width="4" marker-end="url(#ahy)"/>
  <text x="667" y="318" text-anchor="middle" font-size="28" font-weight="bold" fill="#ffd028">コピー</text>
  <rect x="730" y="275" width="440" height="110" rx="12" fill="#1f2333" stroke="#5a6182" stroke-width="2"/>
  <!-- 小さなファイル組 ×2 -->
  <rect x="748" y="295" width="26" height="36" fill="none" stroke="#ffd028" stroke-width="2"/>
  <rect x="780" y="295" width="26" height="36" fill="none" stroke="#8fb4ff" stroke-width="2"/>
  <rect x="808" y="330" width="26" height="36" fill="none" stroke="#ffd028" stroke-width="2"/>
  <rect x="840" y="330" width="26" height="36" fill="none" stroke="#8fb4ff" stroke-width="2"/>
  <text x="885" y="320" font-size="28" fill="#e8eaf2">同じVMを増やす</text>
  <text x="885" y="364" font-size="28" fill="#e8eaf2">まるごと控え</text>

  <!-- ===== 右中：移動 ===== -->
  <line x1="612" y1="470" x2="722" y2="470" stroke="#ffd028" stroke-width="4" marker-end="url(#ahy)"/>
  <text x="667" y="458" text-anchor="middle" font-size="28" font-weight="bold" fill="#ffd028">移動</text>
  <rect x="730" y="410" width="440" height="115" rx="12" fill="#1f2333" stroke="#5a6182" stroke-width="3"/>
  <rect x="755" y="440" width="30" height="42" fill="none" stroke="#ffd028" stroke-width="2"/>
  <rect x="792" y="440" width="30" height="42" fill="none" stroke="#8fb4ff" stroke-width="2"/>
  <text x="885" y="455" font-size="30" font-weight="bold" fill="#e8eaf2">ホストB</text>
  <text x="885" y="500" font-size="28" fill="#e8eaf2">故障・点検でも動く</text>

  <!-- ===== 右下：注意 ===== -->
  <rect x="640" y="548" width="530" height="97" rx="12" fill="#2a1c22" stroke="#e5484d" stroke-width="3"/>
  <text x="660" y="588" font-size="28" fill="#e8eaf2"><tspan fill="#e5484d" font-weight="bold">注意：</tspan>持ち出し＝中身まるごと流出</text>
  <text x="660" y="629" font-size="28" fill="#e8eaf2">→ <tspan fill="#e5484d" font-weight="bold">保存場所を守る</tspan></text>
</svg>
