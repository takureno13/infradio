  <text x="215" y="568" text-anchor="middle" font-size="32" font-weight="bold" fill="#ffd028">手直しが広い</text>

  <!-- ② 更新するとき -->
  <text x="600" y="188" text-anchor="middle" font-size="32" font-weight="bold" fill="#e8eaf2">② 更新するとき</text>
