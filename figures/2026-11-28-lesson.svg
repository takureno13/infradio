  <text x="878" y="262" text-anchor="middle" font-size="28" fill="#9aa0b4">A班</text>
  <text x="990" y="262" text-anchor="middle" font-size="28" fill="#9aa0b4">B班</text>
  <text x="1102" y="262" text-anchor="middle" font-size="28" fill="#9aa0b4">C班</text>

  <rect x="830" y="285" width="96" height="110" rx="6" fill="#2a3045" stroke="#e8eaf2" stroke-width="2"/>
  <text x="878" y="350" text-anchor="middle" font-size="28" fill="#e8eaf2">調理台</text>
  <rect x="942" y="285" width="96" height="110" rx="6" fill="#2a3045" stroke="#e8eaf2" stroke-width="2"/>
