  <text x="985" y="568" text-anchor="middle" font-size="32" font-weight="bold" fill="#ffd028">サイロ化</text>

  <text x="600" y="645" text-anchor="middle" font-size="28" fill="#e8eaf2">今日の用語 <tspan fill="#ffd028">サイロ化</tspan>＝箱ごとに管理が分かれること</text>
